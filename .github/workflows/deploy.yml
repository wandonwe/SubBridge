name: Deploy

# Fully self-bootstrapping deploy: provisions the KV namespace, fills the
# wrangler.toml id, deploys the Worker, sets the short-link secret, bakes the
# API base URL into the frontend and deploys Pages.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — permissions: Workers Scripts:Edit,
#                            Workers KV Storage:Edit, Cloudflare Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id
#   SUBBRIDGE_SECRET       — (optional) long random string for encrypted
#                            short links; set once and never rotate casually
#   API_DOMAIN             — (optional) custom API hostname, e.g.
#                            api.example.com; if unset, the fork's own
#                            workers.dev subdomain is used automatically
#   CORS_ORIGINS           — (optional) comma-separated allowed origins to
#                            restrict the API; if unset, any origin (*) is
#                            allowed
#   PAGES_PROJECT          — (optional) Pages project name (= <name>.pages.dev,
#                            globally unique); default subbridge-<account:8>

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-worker:
    name: Deploy Worker (API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision KV namespace (first run only)
        working-directory: apps/worker
        run: |
          if grep -q REPLACE_WITH_YOUR_KV_NAMESPACE_ID wrangler.toml; then
            ID=$(pnpm exec wrangler kv namespace list | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const a=JSON.parse(d);const m=a.find(n=>n.title.includes('SUBBRIDGE_KV'));console.log(m?m.id:'')}catch{console.log('')}})")
            if [ -z "$ID" ]; then
              echo "Creating KV namespace…"
              ID=$(pnpm exec wrangler kv namespace create SUBBRIDGE_KV | grep -oE '[0-9a-f]{32}' | head -1)
            fi
            if [ -z "$ID" ]; then
              echo "::error::could not provision KV namespace"; exit 1
            fi
            sed -i "s/REPLACE_WITH_YOUR_KV_NAMESPACE_ID/$ID/" wrangler.toml
            echo "Using KV namespace $ID"
          else
            echo "KV namespace id already configured."
          fi

      - name: Apply CORS whitelist (when CORS_ORIGINS is configured)
        working-directory: apps/worker
        env:
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        run: |
          if [ -n "$CORS_ORIGINS" ]; then
            sed -i "s|^CORS_ORIGINS = .*|CORS_ORIGINS = \"$CORS_ORIGINS\"|" wrangler.toml
            echo "CORS restricted to: $CORS_ORIGINS"
          else
            echo "CORS_ORIGINS not set — allowing any origin (*)."
          fi

      - name: Deploy to Cloudflare Workers
        working-directory: apps/worker
        run: pnpm exec wrangler deploy

      - name: Set short-link secret (when SUBBRIDGE_SECRET is configured)
        working-directory: apps/worker
        env:
          SUBBRIDGE_SECRET: ${{ secrets.SUBBRIDGE_SECRET }}
        run: |
          if [ -n "$SUBBRIDGE_SECRET" ]; then
            printf '%s' "$SUBBRIDGE_SECRET" | pnpm exec wrangler secret put SECRET
          else
            echo "SUBBRIDGE_SECRET not set — short links stay disabled (501)."
          fi

  deploy-pages:
    name: Deploy Frontend (Pages)
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve API endpoint for the frontend
        env:
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
        run: |
          if [ -n "$API_DOMAIN" ]; then
            ENDPOINT="$API_DOMAIN"
            echo "Using custom API domain: $ENDPOINT"
          else
            SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).result?.subdomain??'')}catch{console.log('')}})")
            if [ -z "$SUB" ]; then
              echo "::error::could not resolve workers.dev subdomain and no API_DOMAIN set"; exit 1
            fi
            ENDPOINT="subbridge-api.$SUB.workers.dev"
            echo "Using workers.dev endpoint: $ENDPOINT"
          fi
          # The frontend calls the API by absolute URL (baked in at build).
          echo "VITE_API_BASE=https://$ENDPOINT" >> "$GITHUB_ENV"
          echo "Frontend will call API at https://$ENDPOINT"

      - name: Build frontend
        env:
          VITE_API_BASE: ${{ env.VITE_API_BASE }}
        run: pnpm --filter @subbridge/frontend build

      - name: Resolve Pages project name
        env:
          PAGES_PROJECT: ${{ secrets.PAGES_PROJECT }}
        run: |
          # pages.dev subdomains are GLOBALLY unique, so default to a name
          # derived from the account id — forks never collide. Set the
          # PAGES_PROJECT secret to pick your own name.
          PROJECT="${PAGES_PROJECT:-subbridge-${CLOUDFLARE_ACCOUNT_ID:0:8}}"
          echo "PAGES_PROJECT_NAME=$PROJECT" >> "$GITHUB_ENV"
          echo "Deploying Pages project: $PROJECT"

      - name: Ensure Pages project exists
        run: pnpm --dir apps/worker exec wrangler pages project create "$PAGES_PROJECT_NAME" --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        run: pnpm --dir apps/worker exec wrangler pages deploy ../frontend/dist --project-name="$PAGES_PROJECT_NAME"
